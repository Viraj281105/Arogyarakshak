# ──────────────────────────────────────────────────────────────────────
# ArogyaRakshak — Docker Compose
# ──────────────────────────────────────────────────────────────────────
# Services:
#   postgres  — PostgreSQL 16 with pgvector extension
#   api       — FastAPI backend (depends on postgres)
#   web       — Next.js 15 frontend dev server
#
# There is no vector or graph database service: FAISS is an unwired scaffold, and the
# Kadi case graph (#86) is computed from Postgres rows on request.
# ──────────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL + pgvector ──────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arogyarakshak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arogyarakshak}
      POSTGRES_DB: ${POSTGRES_DB:-arogyarakshak}
    # Bound to localhost only (P0-5): the `api` service reaches postgres over the
    # internal Docker network by service name (see DATABASE_URL below) and does not need
    # this host port mapping at all. It exists solely for host-side debugging (psql,
    # pgAdmin, a local client) — "5432:5432" previously bound to 0.0.0.0, exposing
    # Postgres (with its default arogyarakshak/arogyarakshak credentials) to the whole
    # network/internet on any host where inbound 5432 is not separately firewalled.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arogyarakshak}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── FastAPI backend ────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    # Local dev only: hot reload. The image's default CMD runs without --reload.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://arogyarakshak:arogyarakshak@postgres:5432/arogyarakshak}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      # Without this the container can never reach Groq, and every LLM path silently
      # degrades to regex/template fallbacks.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # Optional IndicSBERT cross-lingual signal for Kadi entity resolution (#30). Off by
      # default; when true, the ~950 MB model downloads from the Hugging Face Hub on first use.
      KADI_SEMANTIC_MATCHING: ${KADI_SEMANTIC_MATCHING:-false}
    volumes:
      # Model weights only (never documents), so the download survives container rebuilds.
      # Must match HF_HOME in apps/api/Dockerfile, which the non-root app user owns.
      - hf_cache:/home/app/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy

  # ── Next.js frontend ──────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"

volumes:
  pgdata:
  hf_cache:
