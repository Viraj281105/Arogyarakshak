# ──────────────────────────────────────────────────────────────────────
# ArogyaRakshak — local demo override (ADR-013, issue #40)
#
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d --build
#
# What it changes relative to docker-compose.yml:
#   * api: no --reload, demo mode ON, governance key REQUIRED (compose refuses to start
#     without CLINICAL_GOVERNANCE_ADMIN_KEY), GROQ_API_KEY left to your environment.
#   * web: runs the production build (the image's default CMD) instead of `next dev`.
# Ports stay bound to localhost only. This is for a laptop demo, not a public host:
# demo mode is refused when APP_ENV=production (app.config).
# ──────────────────────────────────────────────────────────────────────

services:
  api:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment:
      CLINICAL_DEMO_MODE: "true"
      APP_ENV: development
      CLINICAL_GOVERNANCE_ADMIN_KEY: ${CLINICAL_GOVERNANCE_ADMIN_KEY:?set CLINICAL_GOVERNANCE_ADMIN_KEY to a long random demo key}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: runtime
    command: ["npm", "run", "start", "--", "--hostname", "0.0.0.0"]
    ports: !override
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
