name: Supply Chain (release)

# Runs ONLY when a release tag (v*) is pushed. It never runs for pull requests or branch
# pushes, so a fork or a PR can never obtain the OIDC token that keyless signing needs.
# What it does: builds the API image, pushes it to GHCR, generates an SPDX SBOM of that
# exact image, signs the image digest with keyless cosign (Sigstore, GitHub OIDC identity)
# and attaches the SBOM as a signed attestation.
#
# NOT YET RUN. Nothing here has been executed (no cosign or syft locally); the first
# release tag is the first test. Verify a release image with:
#   cosign verify ghcr.io/<owner>/<repo>/api@<digest> \
#     --certificate-identity-regexp 'https://github.com/<owner>/<repo>/.github/workflows/supply-chain.yml@refs/tags/v.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-image:
    name: "Build, SBOM, sign (release tag only)"
    # Defence in depth: the trigger already restricts this, and the condition keeps it
    # true if someone later widens `on:`.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write   # push the image to GHCR
      id-token: write   # keyless cosign: short-lived OIDC identity, no stored key
      attestations: write
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4

      - name: Compute lower-case image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}/api" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the API image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM (SPDX) for the pushed image
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom.spdx.json

      - uses: sigstore/cosign-installer@v3

      - name: Sign the image digest (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attach the SBOM as a signed attestation (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${DIGEST}"
