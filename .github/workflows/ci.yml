name: ArogyaRakshak CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-ci:
    name: Python Monorepo Package Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Base Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pydantic pydantic-settings

      - name: Install Local Packages in Editable Mode
        run: |
          pip install -e packages/kadi
          pip install -e packages/billnyay
          pip install -e packages/schemesetu
          pip install -e packages/dawacheck
          pip install -e packages/daavisetu

      - name: Python Style Checks (Lint)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 packages/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 packages/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Python Unit Tests
        run: |
          pytest packages/

  frontend-ci:
    name: Frontend (Next.js) checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Next.js Linter
        run: npm run lint

      - name: Run Production Next.js Build
        run: npm run build
