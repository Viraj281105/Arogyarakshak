name: ArogyaRakshak Production CI/CD Pipeline

on:
  push:
    branches: [main, master, develop, viraj-dev, 'feature/**', 'fix/**', 'release/**']
  pull_request:
    branches: [main, master, develop, viraj-dev]
  workflow_dispatch:

# Cancel in-progress runs on the same branch/ref to preserve compute resources
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. GOVERNANCE & ARCHITECTURAL INVARIANTS GUARD
  # ──────────────────────────────────────────────────────────────────────────
  governance-and-invariants:
    name: "Architectural Invariants & Security Guard"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python for Invariant Scanners
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Architectural Guardrails & Invariants Scanner
        run: |
          python scripts/ci_guardrails.py

  # ──────────────────────────────────────────────────────────────────────────
  # 2. BACKEND TEST MATRIX & STATIC ANALYSIS (FastAPI & Domain Packages)
  # ──────────────────────────────────────────────────────────────────────────
  backend-ci:
    name: "Backend Suite (Python 3.11 · PostgreSQL 16 pgvector)"
    runs-on: ubuntu-latest
    needs: [governance-and-invariants]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: arogyarakshak
          POSTGRES_PASSWORD: arogyarakshak
          POSTGRES_DB: arogyarakshak
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arogyarakshak -d arogyarakshak"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            apps/api/requirements.txt
            packages/*/pyproject.toml

      - name: Install Dependencies & Monorepo Domain Packages
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r apps/api/requirements.txt
          pip install -e packages/kadi
          pip install -e packages/billnyay
          pip install -e packages/daavisetu
          pip install -e packages/bimanyay
          pip install -e packages/schemesetu
          pip install -e packages/dawacheck
          pip install pytest pytest-asyncio pytest-cov aiosqlite httpx ruff reportlab

      - name: Python Code Syntax & Lint Check (Ruff)
        run: |
          echo "Running fast lint check on FastAPI backend and domain packages..."
          python -m ruff check apps/api packages --select=E9,F63,F7,F82 --target-version=py311

      - name: Run Full Test Suite with Coverage
        env:
          DATABASE_URL: postgresql://arogyarakshak:arogyarakshak@localhost:5432/arogyarakshak
          GROQ_MODEL: openai/gpt-oss-120b
          GROQ_API_KEY: mock_test_key_for_ci
          PYTHONPATH: apps/api
        run: |
          python -m pytest \
            --cov=packages \
            --cov=apps/api/app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -v

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: coverage.xml
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # 3. WEB CLIENT VALIDATION (Next.js 16 App Router)
  # ──────────────────────────────────────────────────────────────────────────
  web-ci:
    name: "Web Client (Next.js 16 · React 19 · ESLint · Build)"
    runs-on: ubuntu-latest
    needs: [governance-and-invariants]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Cache Next.js Build Output
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}-${{ hashFiles('apps/web/app/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}-

      - name: Install Web Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run Web Linter
        working-directory: apps/web
        run: npm run lint

      - name: Compile Next.js Production Build
        working-directory: apps/web
        run: npm run build

  # ──────────────────────────────────────────────────────────────────────────
  # 4. MOBILE CLIENT VALIDATION (Expo SDK 52 · TypeScript · Tests)
  # ──────────────────────────────────────────────────────────────────────────
  mobile-ci:
    name: "Mobile Client (Expo SDK 52 · TypeScript · Unit Tests)"
    runs-on: ubuntu-latest
    needs: [governance-and-invariants]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install Mobile Dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Type-Check Mobile Codebase (tsc --noEmit)
        working-directory: apps/mobile
        run: npm run type-check

      - name: Run Mobile Unit & Contract Test Suite
        working-directory: apps/mobile
        run: npm test

  # ──────────────────────────────────────────────────────────────────────────
  # 5. DOCKER & INFRASTRUCTURE INTEGRITY
  # ──────────────────────────────────────────────────────────────────────────
  docker-verification:
    name: "Docker & Container Build Verification"
    runs-on: ubuntu-latest
    needs: [governance-and-invariants]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet
          echo "✓ docker-compose.yml configuration is valid."

      - name: Build Backend Container Image (Dry Run)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: arogyarakshak-api:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web Container Image (Dry Run)
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: false
          tags: arogyarakshak-web:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────────────────
  # 6. UNIFIED CI BRANCH PROTECTION GATE
  # ──────────────────────────────────────────────────────────────────────────
  ci-gate:
    name: "CI Quality Gate"
    runs-on: ubuntu-latest
    if: always()
    needs:
      - governance-and-invariants
      - backend-ci
      - web-ci
      - mobile-ci
      - docker-verification

    steps:
      - name: Check All Upstream Jobs
        run: |
          INVARIANTS="${{ needs.governance-and-invariants.result }}"
          BACKEND="${{ needs.backend-ci.result }}"
          WEB="${{ needs.web-ci.result }}"
          MOBILE="${{ needs.mobile-ci.result }}"
          DOCKER="${{ needs.docker-verification.result }}"

          echo "=========================================="
          echo "     AROGYARAKSHAK CI PIPELINE SUMMARY    "
          echo "=========================================="
          echo "Architectural Invariants & Security: $INVARIANTS"
          echo "Backend Test Suite (FastAPI + Packages): $BACKEND"
          echo "Web Frontend (Next.js 16 + ESLint): $WEB"
          echo "Mobile Frontend (Expo 52 + Tests):  $MOBILE"
          echo "Docker & Compose Build Verification: $DOCKER"
          echo "=========================================="

          # Output to GitHub Step Summary
          echo "## 🛡️ ArogyaRakshak CI Quality Gate" >> $GITHUB_STEP_SUMMARY
          echo "| Pipeline Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Architectural Invariants & Security | $INVARIANTS |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Test Suite (FastAPI + Packages) | $BACKEND |" >> $GITHUB_STEP_SUMMARY
          echo "| Web Frontend (Next.js 16 + ESLint) | $WEB |" >> $GITHUB_STEP_SUMMARY
          echo "| Mobile Frontend (Expo 52 + Tests) | $MOBILE |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker & Compose Build Verification | $DOCKER |" >> $GITHUB_STEP_SUMMARY

          if [ "$INVARIANTS" = "success" ] && \
             [ "$BACKEND" = "success" ] && \
             [ "$WEB" = "success" ] && \
             [ "$MOBILE" = "success" ] && \
             [ "$DOCKER" = "success" ]; then
            echo " All CI quality checks PASSED!"
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Result: PASSED**" >> $GITHUB_STEP_SUMMARY
            exit 0
          else
            echo " One or more CI checks FAILED."
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Result: FAILED**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
