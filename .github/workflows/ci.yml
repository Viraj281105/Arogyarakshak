name: ArogyaRakshak Production CI/CD Pipeline

on:
  push:
    branches: [main, master, develop, viraj-dev, 'feature/**', 'fix/**', 'release/**']
  pull_request:
    branches: [main, master, develop, viraj-dev]
  workflow_dispatch:

# Cancel in-progress runs on the same branch/ref to preserve compute resources
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: no job writes to the repository, checks or pull requests.
permissions:
  contents: read

# Project network rule: no telemetry endpoints from CI (only GitHub runners,
# Postgres service containers and the PyPI/npm registries). Covers `next build`,
# lhci's `next start` and `expo export`.
env:
  EXPO_NO_TELEMETRY: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. GOVERNANCE & ARCHITECTURAL INVARIANTS GUARD
  # ──────────────────────────────────────────────────────────────────────────
  governance-and-invariants:
    name: "Architectural Invariants & Security Guard"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python for Invariant Scanners
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Architectural Guardrails & Invariants Scanner
        run: |
          python scripts/ci_guardrails.py

  # ──────────────────────────────────────────────────────────────────────────
  # 1b. FOUNDATION CHECKS (shared-code freshness, generated files, root tooling tests)
  # ──────────────────────────────────────────────────────────────────────────
  foundation-checks:
    name: "Foundation Checks (generated files fresh · root tooling tests)"
    runs-on: ubuntu-latest
    needs: [governance-and-invariants]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # Deliberately Node 20: proves our scripts run on it. EBADENGINE warnings from the
      # @lhci/cli devDependency (needs Node >= 22.19) are expected and accepted here.
      - name: Install Root Tooling Dependencies
        run: npm ci

      - name: Run Root Tooling & Package Node Tests
        run: npm test

      - name: Verify Generated and Vendored Files Are Fresh
        run: npm run check:generated

  # ──────────────────────────────────────────────────────────────────────────
  # 2. BACKEND TEST MATRIX & STATIC ANALYSIS (FastAPI & Domain Packages)
  # ──────────────────────────────────────────────────────────────────────────
  backend-ci:
    name: "Backend Suite (Python 3.11 · PostgreSQL 16 pgvector)"
    runs-on: ubuntu-latest
    needs: [governance-and-invariants]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: arogyarakshak
          POSTGRES_PASSWORD: arogyarakshak
          POSTGRES_DB: arogyarakshak
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arogyarakshak -d arogyarakshak"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            apps/api/requirements.txt
            packages/*/pyproject.toml

      - name: Install Dependencies & Monorepo Domain Packages
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r apps/api/requirements.txt
          # -c pins EasyOCR's transitive torch/torchvision to the CPU-only build — see
          # apps/api/constraints-cpu.txt. Without it this installs the default CUDA
          # wheel (~2.8 GB of unused nvidia-*/triton packages on a GPU-less runner).
          # [semantic] = sentence-transformers for the optional IndicSBERT signal (#30). Tests
          # mock the encoder; installing the extra proves it resolves under the CPU pins.
          pip install -c apps/api/constraints-cpu.txt -e "packages/kadi[semantic]"
          pip install -c apps/api/constraints-cpu.txt -e packages/billnyay
          pip install -c apps/api/constraints-cpu.txt -e packages/daavisetu
          pip install -c apps/api/constraints-cpu.txt -e packages/bimanyay
          pip install -c apps/api/constraints-cpu.txt -e packages/schemesetu
          pip install -c apps/api/constraints-cpu.txt -e packages/dawacheck
          # PyMuPDF (fitz) is test-only: apps/api/tests/test_api.py's _pdf_text() reads
          # generated PDFs back to verify content. It is not an app runtime dependency
          # (apps/api/requirements.txt), so it belongs with the other test tooling here.
          pip install pytest pytest-asyncio pytest-cov aiosqlite httpx ruff reportlab PyMuPDF==1.24.1
          # Architecture contracts (.importlinter, ADR-018) and the manifest policy tests.
          pip install import-linter==2.1 PyYAML

      - name: Python Code Syntax & Lint Check (Ruff)
        run: |
          echo "Running fast lint check on FastAPI backend and domain packages..."
          python -m ruff check apps/api packages --select=E9,F63,F7,F82 --target-version=py311

      - name: Architecture Contracts (import-linter)
        env:
          PYTHONPATH: apps/api
        run: lint-imports

      - name: Database Migrations Apply to PostgreSQL and Match the Models
        env:
          DATABASE_URL: postgresql://arogyarakshak:arogyarakshak@localhost:5432/arogyarakshak
          PGPASSWORD: arogyarakshak
        working-directory: apps/api
        run: |
          # A real upgrade on PostgreSQL 16, then Alembic's own drift check (ADR-020).
          alembic upgrade head
          alembic check
          alembic current
          # Separate empty database for the round-trip test in test_migrations.py.
          psql -h localhost -U arogyarakshak -d arogyarakshak -c "CREATE DATABASE migration_test"

      - name: Run Full Test Suite with Coverage
        env:
          DATABASE_URL: postgresql://arogyarakshak:arogyarakshak@localhost:5432/arogyarakshak
          MIGRATION_TEST_DATABASE_URL: postgresql://arogyarakshak:arogyarakshak@localhost:5432/migration_test
          GROQ_MODEL: openai/gpt-oss-120b
          # No GROQ_API_KEY on purpose: tests never reach the network (the apps/api and
          # kadi test conftests also clear any key and guard urllib.request.urlopen).
          PYTHONPATH: apps/api
        run: |
          python -m pytest \
            --cov=packages \
            --cov=apps/api/app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -v

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: coverage.xml
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # 3. WEB CLIENT VALIDATION (Next.js 16 App Router)
  # ──────────────────────────────────────────────────────────────────────────
  web-ci:
    name: "Web Client (Next.js 16 · React 19 · ESLint · Build)"
    runs-on: ubuntu-latest
    needs: [governance-and-invariants]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Cache Next.js Build Output
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}-${{ hashFiles('apps/web/app/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}-

      - name: Install Web Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run Web Linter
        working-directory: apps/web
        run: npm run lint

      - name: Run Web Unit & Contract Test Suite
        working-directory: apps/web
        run: npm test

      - name: Compile Next.js Production Build
        working-directory: apps/web
        run: npm run build

      - name: Install Root Tooling Dependencies (budget checks)
        run: npm ci

      - name: Enforce Web Initial-JS Bundle Budget
        run: npm run check:web-budget

      # @lhci/cli and the Lighthouse it bundles require Node >= 22.19 (engines), so the
      # Lighthouse step alone runs on Node 22; the rest of this job stays on Node 20.
      - name: Set up Node.js 22 (Lighthouse CI)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Root Tooling Dependencies (Node 22, for Lighthouse CI)
        run: npm ci

      - name: Lighthouse CI (LCP / CLS budgets on the local production server)
        run: npx lhci autorun --config=apps/web/lighthouserc.json

  # ──────────────────────────────────────────────────────────────────────────
  # 4. MOBILE CLIENT VALIDATION (Expo SDK 52 · TypeScript · Tests)
  # ──────────────────────────────────────────────────────────────────────────
  mobile-ci:
    name: "Mobile Client (Expo SDK 52 · TypeScript · Unit Tests)"
    runs-on: ubuntu-latest
    needs: [governance-and-invariants]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install Mobile Dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Type-Check Mobile Codebase (tsc --noEmit)
        working-directory: apps/mobile
        run: npm run type-check

      - name: Run Mobile Unit & Contract Test Suite
        working-directory: apps/mobile
        run: npm test

      - name: Export Android Bundle (Hermes)
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/mobile-export"

      - name: Enforce Mobile Bundle Size Budget
        run: node scripts/build-checks/mobile-bundle-budget.mjs "$RUNNER_TEMP/mobile-export"

  # ──────────────────────────────────────────────────────────────────────────
  # 5. DOCKER & INFRASTRUCTURE INTEGRITY
  # ──────────────────────────────────────────────────────────────────────────
  docker-verification:
    name: "Docker & Container Build Verification"
    runs-on: ubuntu-latest
    needs: [governance-and-invariants]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet
          CLINICAL_GOVERNANCE_ADMIN_KEY=ci-placeholder docker compose -f docker-compose.yml -f docker-compose.demo.yml config --quiet
          echo "✓ docker-compose.yml and the demo override are valid."

      - name: Render Kubernetes Manifests (kustomize)
        run: |
          kubectl kustomize infrastructure/kubernetes/overlays/example > /dev/null
          echo "✓ infrastructure/kubernetes renders. Policy checks run in the backend test suite."

      - name: Build Backend Container Image (Dry Run)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: arogyarakshak-api:ci-test
          cache-from: type=gha
          # Both Dockerfiles are multi-stage now; mode=max also caches the build stage,
          # which is where the slow dependency installs happen.
          cache-to: type=gha,mode=max

      - name: Build Web Container Image (Dry Run)
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: false
          tags: arogyarakshak-web:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────────────────
  # 6. UNIFIED CI BRANCH PROTECTION GATE
  # ──────────────────────────────────────────────────────────────────────────
  ci-gate:
    name: "CI Quality Gate"
    runs-on: ubuntu-latest
    if: always()
    needs:
      - governance-and-invariants
      - foundation-checks
      - backend-ci
      - web-ci
      - mobile-ci
      - docker-verification
      - eval-regression-gate

    steps:
      - name: Check All Upstream Jobs
        run: |
          INVARIANTS="${{ needs.governance-and-invariants.result }}"
          FOUNDATION="${{ needs.foundation-checks.result }}"
          BACKEND="${{ needs.backend-ci.result }}"
          WEB="${{ needs.web-ci.result }}"
          MOBILE="${{ needs.mobile-ci.result }}"
          DOCKER="${{ needs.docker-verification.result }}"
          EVAL_GATE="${{ needs.eval-regression-gate.result }}"

          echo "=========================================="
          echo "     AROGYARAKSHAK CI PIPELINE SUMMARY    "
          echo "=========================================="
          echo "Architectural Invariants & Security: $INVARIANTS"
          echo "Foundation Checks (generated files + tooling tests): $FOUNDATION"
          echo "Backend Test Suite (FastAPI + Packages): $BACKEND"
          echo "Web Frontend (Next.js 16 + ESLint): $WEB"
          echo "Mobile Frontend (Expo 52 + Tests):  $MOBILE"
          echo "Docker & Compose Build Verification: $DOCKER"
          echo "Evaluation Regression Gate (offline, synthetic): $EVAL_GATE"
          echo "=========================================="

          # Output to GitHub Step Summary
          echo "## 🛡️ ArogyaRakshak CI Quality Gate" >> $GITHUB_STEP_SUMMARY
          echo "| Pipeline Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Architectural Invariants & Security | $INVARIANTS |" >> $GITHUB_STEP_SUMMARY
          echo "| Foundation Checks (generated files + tooling tests) | $FOUNDATION |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Test Suite (FastAPI + Packages) | $BACKEND |" >> $GITHUB_STEP_SUMMARY
          echo "| Web Frontend (Next.js 16 + ESLint) | $WEB |" >> $GITHUB_STEP_SUMMARY
          echo "| Mobile Frontend (Expo 52 + Tests) | $MOBILE |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker & Compose Build Verification | $DOCKER |" >> $GITHUB_STEP_SUMMARY
          echo "| Evaluation Regression Gate (offline, synthetic) | $EVAL_GATE |" >> $GITHUB_STEP_SUMMARY

          if [ "$INVARIANTS" = "success" ] && \
             [ "$FOUNDATION" = "success" ] && \
             [ "$BACKEND" = "success" ] && \
             [ "$WEB" = "success" ] && \
             [ "$MOBILE" = "success" ] && \
             [ "$DOCKER" = "success" ] && \
             [ "$EVAL_GATE" = "success" ]; then
            echo " All CI quality checks PASSED!"
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Result: PASSED**" >> $GITHUB_STEP_SUMMARY
            exit 0
          else
            echo " One or more CI checks FAILED."
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Result: FAILED**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # 7. EVALUATION REGRESSION GATE (offline harnesses vs the committed baseline)
  # ──────────────────────────────────────────────────────────────────────────
  # WS2 / ADR-024. Re-runs the Phase-4 harnesses (offline heuristic/rule paths on the
  # SYNTHETIC datasets in data/evaluation/) and fails if any headline metric drops below
  # apps/api/app/evaluation/baseline/phase4_baseline.json or a dataset size changes.
  # This is NOT an LLM-accuracy check: no Groq key is set and nothing calls the network.
  eval-regression-gate:
    name: "Evaluation Regression Gate (offline harnesses · synthetic data)"
    runs-on: ubuntu-latest
    needs: [governance-and-invariants]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            apps/api/requirements.txt
            packages/*/pyproject.toml

      # The harnesses import no OCR/torch code, so the domain packages are installed
      # without their heavy dependencies (EasyOCR/torch); the API requirements cover the rest.
      - name: Install API Requirements & Domain Packages (no OCR stack)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r apps/api/requirements.txt
          pip install --no-deps -e packages/kadi -e packages/billnyay -e packages/bimanyay -e packages/dawacheck

      - name: Compare Harness Metrics With the Committed Baseline
        env:
          PYTHONPATH: apps/api
        run: python scripts/check_eval_regression.py

  # ──────────────────────────────────────────────────────────────────────────
  # 8. HINDI / MARATHI TERMINOLOGY AUDIT (REPORT ONLY)
  # ──────────────────────────────────────────────────────────────────────────
  # Mechanical findings (spelling variants, one concept with two terms, Latin words left in
  # hi/mr text) for a native-speaker reviewer (#37). It states what a machine can find, never
  # what is correct. It is NOT part of the quality gate: ci-gate does not list it in `needs`,
  # so a failure here cannot block a merge, and continue-on-error keeps the run green.
  terminology-audit:
    name: "Terminology Audit (report only · not a gate)"
    runs-on: ubuntu-latest
    needs: [governance-and-invariants]
    continue-on-error: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Root Tooling Dependencies
        run: npm ci

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            apps/api/requirements.txt
            packages/*/pyproject.toml

      # The audit renders the BimaNyay letters and reads BillNyay's fallback letters; it
      # needs no OCR/torch stack, so the packages are installed without their dependencies.
      - name: Install API Requirements & Domain Packages (no OCR stack)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r apps/api/requirements.txt
          pip install --no-deps -e packages/kadi -e packages/billnyay -e packages/bimanyay

      - name: Generate the Reviewer Worksheet
        env:
          PYTHONPATH: apps/api
          PYTHONIOENCODING: utf-8
        run: |
          mkdir -p terminology-report
          python scripts/terminology_audit.py \
            --markdown terminology-report/terminology-worksheet.md \
            --json terminology-report/terminology-audit.json | tee terminology-report/summary.txt
          cat terminology-report/summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the Worksheet (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminology-audit-worksheet
          path: terminology-report/
          if-no-files-found: warn
          retention-days: 30
