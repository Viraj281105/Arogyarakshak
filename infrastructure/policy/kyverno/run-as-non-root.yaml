apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: run-as-non-root
  annotations:
    policies.kyverno.io/title: "Run as non-root"
    policies.kyverno.io/category: ArogyaRakshak Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Pods in the arogyarakshak namespace must set securityContext.runAsNonRoot: true.
      Mirrors the rule "run-as-non-root" in policy_checks.py and rego/workload.rego.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: pod-run-as-non-root
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [arogyarakshak]
      validate:
        message: "securityContext.runAsNonRoot must be true."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
