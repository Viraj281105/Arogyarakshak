# Shared policy fixture: must violate exactly rule 'run-as-non-root' in every engine.
kind: k8s
rule: run-as-non-root
kyverno_rules:
- container-run-as-non-root
object:
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: t
    namespace: arogyarakshak
  spec:
    template:
      spec:
        securityContext:
          runAsNonRoot: true
        containers:
        - name: app
          image: registry.example/app:1.2.3
          resources:
            limits:
              cpu: '1'
              memory: 1Gi
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: false
