# Shared policy fixture: must violate exactly rule 'disallow-latest-tag' in every engine.
kind: k8s
rule: disallow-latest-tag
kyverno_rules:
- disallow-latest
object:
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: t
    namespace: arogyarakshak
  spec:
    template:
      spec:
        securityContext:
          runAsNonRoot: true
        containers:
        - name: app
          image: registry.example/app:1.2.3
          resources:
            limits:
              cpu: '1'
              memory: 1Gi
          securityContext:
            readOnlyRootFilesystem: true
        initContainers:
        - name: init
          image: busybox:latest
          resources:
            limits:
              cpu: '1'
              memory: 1Gi
          securityContext:
            readOnlyRootFilesystem: true
