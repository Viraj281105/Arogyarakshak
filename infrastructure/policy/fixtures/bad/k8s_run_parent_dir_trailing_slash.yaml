# Shared policy fixture: must violate exactly rule 'disallow-docker-sock' in every engine.
kind: k8s
rule: disallow-docker-sock
kyverno_rules:
- no-docker-socket-hostpath
object:
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: t
    namespace: arogyarakshak
  spec:
    template:
      spec:
        securityContext:
          runAsNonRoot: true
        containers:
        - name: app
          image: registry.example/app:1.2.3
          resources:
            limits:
              cpu: '1'
              memory: 1Gi
          securityContext:
            readOnlyRootFilesystem: true
        volumes:
        - name: d
          hostPath:
            path: /run/
