# Shared policy fixture: must violate exactly rule 'require-resource-limits' in every engine.
kind: k8s
rule: require-resource-limits
kyverno_rules:
- container-limits
object:
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: t
    namespace: arogyarakshak
  spec:
    template:
      spec:
        securityContext:
          runAsNonRoot: true
        containers:
        - name: app
          image: registry.example/app:1.2.3
          resources:
            limits:
              cpu: '1'
              memory: 1Gi
          securityContext:
            readOnlyRootFilesystem: true
        ephemeralContainers:
        - name: dbg
          image: registry.example/app:1.2.3
          resources: {}
          securityContext:
            readOnlyRootFilesystem: true
