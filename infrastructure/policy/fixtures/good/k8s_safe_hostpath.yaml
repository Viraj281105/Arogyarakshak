# Shared policy fixture: must produce NO violations in any engine.
kind: k8s
object:
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: t
    namespace: arogyarakshak
  spec:
    template:
      spec:
        securityContext:
          runAsNonRoot: true
        containers:
        - name: app
          image: registry.example/app:1.2.3
          resources:
            limits:
              cpu: '1'
              memory: 1Gi
          securityContext:
            readOnlyRootFilesystem: true
        volumes:
        - name: d
          hostPath:
            path: /mnt/data
