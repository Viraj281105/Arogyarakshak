# Prometheus for the ArogyaRakshak observability stack (docker-compose.observability.yml).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: arogyarakshak

rule_files:
  - /etc/prometheus/rules/*.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # The API container of the compose project. /metrics is internal-only (ADR-023).
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # An API started on the host (uvicorn). Empty by default: list its address in
  # targets/api-host.yml (docs/operations/observability.md). Prometheus re-reads the file.
  - job_name: api-host
    metrics_path: /metrics
    file_sd_configs:
      - files: ["/etc/prometheus/targets/*.yml"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
