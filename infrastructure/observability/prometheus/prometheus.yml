# Prometheus for the ArogyaRakshak observability stack (docker-compose.observability.yml).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: arogyarakshak

rule_files:
  - /etc/prometheus/rules/*.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # One job for both workflows, so rules and dashboards need no workflow switch:
  #   api:8000                    the API container of this compose project
  #   host.docker.internal:8000   an API started on the host (uvicorn); resolves through the
  #                               prometheus service's extra_hosts entry
  # Whichever is not running is a never-up target; ApiTargetDown ignores targets that were never up.
  # /metrics is internal-only (ADR-023).
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels: {workflow: compose}
      - targets: ["host.docker.internal:8000"]
        labels: {workflow: host}

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
