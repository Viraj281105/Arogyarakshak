# OpenTelemetry Collector (contrib): the single ingestion point.
#   traces: OTLP/HTTP from the API   -> Tempo
#   logs:   Docker `fluentd` driver  -> Loki (OTLP), with the JSON line parsed so that
#           trace_id / request_id / level become structured metadata.
# No docker.sock and no host log mounts are involved.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
  fluentforward:
    endpoint: 0.0.0.0:24224

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 200
    spike_limit_mib: 50
  batch: {}
  # Second scrubbing layer for traces (the API already scrubs in-process, app/telemetry/span_scrub.py):
  # no raw request target / query / SQL text, no case ids, no exception message or stacktrace
  # (exception.type is kept). http.route (the template) is kept.
  transform/scrub_spans:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - delete_key(attributes, "http.target")
          - delete_key(attributes, "http.url")
          - delete_key(attributes, "url.full")
          - delete_key(attributes, "url.path")
          - delete_key(attributes, "url.query")
          - delete_key(attributes, "db.statement")
          - delete_key(attributes, "db.query.text")
          - replace_all_patterns(attributes, "value", "CASE-[A-Za-z0-9_-]+", "CASE-<redacted>")
          - replace_pattern(name, "CASE-[A-Za-z0-9_-]+", "CASE-<redacted>")
          - set(status.message, "")
      - context: spanevent
        statements:
          - delete_key(attributes, "exception.message")
          - delete_key(attributes, "exception.stacktrace")
  # Loki's service_name label comes from the resource attribute service.name; Docker's fluentd
  # driver does not set one, so it would be "unknown_service".
  transform/service_name:
    error_mode: ignore
    log_statements:
      - context: resource
        statements:
          - set(attributes["service.name"], "arogyarakshak-api")
  # The API logs one JSON object per line (LOG_FORMAT=json).
  transform/parse_api_json:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - set(body, body["log"]) where IsMap(body) and body["log"] != nil
          - merge_maps(attributes, ParseJSON(body), "upsert") where IsString(body) and IsMatch(body, "^\\{")
          - set(severity_text, attributes["level"]) where attributes["level"] != nil

exporters:
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/scrub_spans, batch]
      exporters: [otlp/tempo]
    logs:
      receivers: [fluentforward]
      processors: [memory_limiter, transform/service_name, transform/parse_api_json, batch]
      exporters: [otlphttp/loki]
