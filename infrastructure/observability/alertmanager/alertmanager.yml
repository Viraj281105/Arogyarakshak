# No notification integration is configured on purpose (ADR-023: nothing leaves this
# machine). Alerts are visible in Alertmanager (http://127.0.0.1:9093) and Grafana. To get
# notifications, add a receiver for a channel you operate.
route:
  receiver: local-only
  group_by: [alertname, slo]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h

receivers:
  - name: local-only
